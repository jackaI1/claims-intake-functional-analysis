name: Intake QA
on:
  push:
    branches: [main, 'skills/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  requirements:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Execute tests and requirement report
        run: python scripts/run_qa.py
      - name: Check committed evidence matches the executed results
        run: git diff --exit-code -- reports/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-python-${{ matrix.python }}
          path: reports/
